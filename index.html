<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172b29">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="포스톡">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>포스톡</title>
  <style>
    :root{--ink:#18211f;--muted:#71807b;--line:#e6ece9;--paper:#fff;--canvas:#f3f6f4;--green:#347c68;--green-dark:#246653;--mint:#e6f4ee;--danger:#b84242;--shadow:0 20px 60px #24382f12}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--canvas)}button,input,textarea{font:inherit}button{cursor:pointer}
    .shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.panel{width:min(100%,780px);height:min(860px,calc(100vh - 48px));min-height:520px;background:var(--paper);border:1px solid #e9eeeb;border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
    .top{display:flex;align-items:center;gap:14px;padding:19px 22px;border-bottom:1px solid var(--line);background:#fff}.mark{width:44px;height:44px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}.brand{min-width:0;flex:1}.brand h1{font-size:18px;margin:0 0 3px;letter-spacing:-.4px}.sub{font-size:12px;color:var(--muted)}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#aab4b0}.dot.on{background:#3ba678;box-shadow:0 0 0 3px #3ba67820}.top-actions{display:flex;align-items:center;gap:8px}.role{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--ink);font-size:12px}.logout{border:0;background:transparent;color:var(--muted);font-size:12px;padding:8px}
    .chat{flex:1;overflow-y:auto;padding:24px clamp(14px,4vw,34px);scroll-behavior:smooth;background:linear-gradient(#fff,#fbfcfb)}.welcome{max-width:430px;margin:30px auto;padding:24px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:center}.welcome-icon{font-size:26px;margin-bottom:8px}.welcome h2{font-size:16px;margin:0 0 6px}.welcome p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.day{display:flex;align-items:center;gap:12px;color:#9aa49f;font-size:11px;margin:10px 0 20px}.day:before,.day:after{content:"";height:1px;background:var(--line);flex:1}.row{display:flex;margin:10px 0;align-items:flex-end;gap:8px}.row.mine{justify-content:flex-end}.bubble-wrap{max-width:min(76%,470px)}.sender{font-size:11px;color:var(--muted);margin:0 0 5px 4px}.mine .sender{text-align:right;margin-right:4px}.bubble{background:#f0f3f1;border-radius:5px 17px 17px 17px;padding:11px 14px;line-height:1.5;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}.mine .bubble{background:var(--mint);border-radius:17px 5px 17px 17px}.time{font-size:10px;color:#9aa49f;white-space:nowrap;padding-bottom:3px}.photo-bubble{padding:5px!important;background:#f0f3f1!important}.photo{display:block;max-width:min(100%,330px);max-height:360px;border-radius:13px;object-fit:contain;cursor:zoom-in;background:#e8eeea}.photo-loading{width:220px;height:120px;border-radius:12px;background:#e8eeea;display:grid;place-items:center;color:var(--muted);font-size:12px}.deleted{padding:10px 14px;color:var(--muted);font-size:12px;font-style:italic}
    .composer{border-top:1px solid var(--line);padding:14px 18px max(14px,env(safe-area-inset-bottom));background:#fff}.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.tools-note{font-size:11px;color:var(--muted)}.photo-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px 11px;color:#53615c;font-size:12px}.photo-btn:hover{border-color:#b7d2c7;background:#f7fbf8}.compose-row{display:flex;align-items:flex-end;gap:9px}.message-input{flex:1;min-height:46px;max-height:130px;resize:vertical;padding:12px 14px;border:1px solid #dfe7e2;border-radius:14px;outline:none;background:#fafcfb;font-size:14px}.message-input:focus{border-color:#7eae9a;box-shadow:0 0 0 3px #347c6814}.send{width:46px;height:46px;border:0;border-radius:14px;color:#fff;background:var(--green);font-size:19px;display:grid;place-items:center}.send:hover{background:var(--green-dark)}.send:disabled,.photo-btn:disabled{opacity:.55;cursor:wait}.notice{min-height:16px;color:var(--muted);font-size:11px;margin:7px 3px 0}.notice.error{color:var(--danger)}.hidden{display:none!important}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,390px);background:#fff;padding:30px;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow)}.login-card .mark{margin-bottom:18px}.login-card h1{font-size:23px;margin:0 0 7px}.login-card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 22px}.field{display:block;margin:0 0 13px}.field span{font-size:12px;color:#64716c;display:block;margin:0 0 6px}.field input{width:100%;height:46px;padding:0 12px;border:1px solid #dfe7e2;border-radius:12px;outline:none}.field input:focus{border-color:#7eae9a}.login-submit{height:46px;width:100%;border:0;background:var(--green);color:white;border-radius:12px;font-weight:700;margin-top:3px}.login-error{min-height:18px;font-size:12px;color:var(--danger);margin-top:10px}.tiny{font-size:11px;color:#8b9691;text-align:center;margin-top:17px;line-height:1.5}
    .lightbox{position:fixed;inset:0;background:#101815e8;display:grid;place-items:center;padding:22px;z-index:10}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox button{position:absolute;top:14px;right:16px;border:0;border-radius:50%;width:42px;height:42px;background:#ffffff20;color:#fff;font-size:24px}
    @media(max-width:600px){.shell{padding:0}.panel{height:100dvh;min-height:0;border:0;border-radius:0}.top{padding:13px 14px;gap:10px}.mark{width:39px;height:39px;border-radius:13px}.brand h1{font-size:16px}.status{font-size:0;gap:0}.status .dot{width:9px;height:9px}.role{padding:7px 8px}.logout{padding:7px 3px}.chat{padding:18px 13px}.bubble-wrap{max-width:83%}.photo{max-width:min(100%,280px);max-height:300px}.composer{padding:11px 12px max(11px,env(safe-area-inset-bottom))}.tools-note{max-width:55%;text-align:right;line-height:1.35}.message-input{font-size:16px}}
  </style>
</head>
<body>
  <main id="loginView" class="login-shell">
    <section class="login-card">
      <div class="mark">톡</div>
      <h1>포스톡</h1>
      <p>포스와 휴대폰 사이에서 문자와 사진을 주고받으세요.</p>
      <form id="loginForm">
        <label class="field"><span>이메일</span><input id="email" type="email" autocomplete="username" required></label>
        <label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" required></label>
        <button class="login-submit" id="loginButton" type="submit">로그인</button>
        <div id="loginError" class="login-error" role="status"></div>
      </form>
      <div class="tiny">Firebase에 등록한 계정으로 로그인합니다.<br>가입은 앱에서 받지 않습니다.</div>
    </section>
  </main>

  <main id="chatView" class="shell hidden">
    <section class="panel">
      <header class="top">
        <div class="mark">톡</div>
        <div class="brand"><h1>포스톡</h1><div class="sub">포스 ↔ 휴대폰</div></div>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">연결 확인 중</span></div>
        <div class="top-actions">
          <button id="installButton" class="logout hidden" type="button">앱 설치</button>
          <select id="deviceRole" class="role" aria-label="이 기기 이름"><option value="휴대폰">휴대폰</option><option value="포스">포스</option></select>
          <button id="logoutButton" class="logout" type="button">로그아웃</button>
        </div>
      </header>
      <section id="messageList" class="chat" aria-live="polite">
        <div id="emptyState" class="welcome"><div class="welcome-icon">💬</div><h2>대화를 시작해보세요</h2><p>이 계정으로 로그인한 포스와 휴대폰에만<br>메시지와 사진이 표시됩니다.</p></div>
      </section>
      <footer class="composer">
        <div class="tools">
          <label class="photo-btn" for="photoInput">＋ 사진 보내기</label>
          <span class="tools-note">사진은 압축해 저장하고 최근 20장만 보관합니다.</span>
          <input id="photoInput" class="hidden" type="file" accept="image/*">
        </div>
        <form id="messageForm" class="compose-row">
          <textarea id="messageInput" class="message-input" rows="1" maxlength="2000" placeholder="메시지를 입력하세요"></textarea>
          <button id="sendButton" class="send" type="submit" aria-label="보내기">➤</button>
        </form>
        <div id="notice" class="notice" role="status"></div>
      </footer>
    </section>
  </main>
  <div id="lightbox" class="lightbox hidden"><button id="closeLightbox" type="button" aria-label="닫기">×</button><img id="lightboxImage" alt="확대된 사진"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    // Firebase Console > 프로젝트 설정 > 내 앱에서 받은 값으로 교체하세요.
    const firebaseConfig = {
      apiKey: "AIzaSyCmhY0_hEnuXRfCnpbHASgkAcnQ5LjA1Hs",
      authDomain: "simplechat-a4ccd.firebaseapp.com",
      databaseURL: "https://simplechat-a4ccd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "simplechat-a4ccd",
      storageBucket: "simplechat-a4ccd.firebasestorage.app",
      messagingSenderId: "1015074708496",
      appId: "1:1015074708496:web:739be619a9a8727876fe95"
    };

    const AUTHORIZED_UID = "kEyiRgPkC8SvXcnIKiwVLbidqRN2";
    const MAX_PHOTOS = 20;
    const MAX_MESSAGES = 300;
    const MAX_COMPRESSED_BYTES = 450 * 1024;
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const $ = (id) => document.getElementById(id);
    const loginView = $("loginView"), chatView = $("chatView");
    const loginForm = $("loginForm"), loginError = $("loginError");
    const messageList = $("messageList"), emptyState = $("emptyState");
    const notice = $("notice"), messageInput = $("messageInput");
    const roleSelect = $("deviceRole");
    let messagesQuery = null;
    let connectedRef = null;
    let cleanupBusy = false;
    let deferredInstallPrompt = null;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      $("installButton").classList.remove("hidden");
    });
    $("installButton").addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      $("installButton").classList.add("hidden");
    });
    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      $("installButton").classList.add("hidden");
    });
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }

    roleSelect.value = localStorage.getItem("poschat-role") || "휴대폰";
    roleSelect.addEventListener("change", () => localStorage.setItem("poschat-role", roleSelect.value));

    function setNotice(message, isError) {
      notice.textContent = message || "";
      notice.classList.toggle("error", !!isError);
    }
    function setBusy(button, busy, label) {
      button.disabled = busy;
      if (label) button.textContent = busy ? label : button.dataset.readyLabel;
    }
    $("loginButton").dataset.readyLabel = "로그인";
    $("sendButton").dataset.readyLabel = "➤";

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      const button = $("loginButton");
      button.disabled = true;
      button.textContent = "로그인 중…";
      try {
        await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
      } catch (error) {
        loginError.textContent = friendlyAuthError(error);
      } finally {
        button.disabled = false;
        button.textContent = "로그인";
      }
    });

    function friendlyAuthError(error) {
      const messages = {
        "auth/invalid-credential": "이메일 또는 비밀번호를 확인해주세요.",
        "auth/user-not-found": "등록된 계정이 없습니다.",
        "auth/wrong-password": "이메일 또는 비밀번호를 확인해주세요.",
        "auth/invalid-email": "이메일 형식을 확인해주세요.",
        "auth/too-many-requests": "로그인 시도가 많습니다. 잠시 후 다시 해주세요.",
        "auth/network-request-failed": "인터넷 연결을 확인해주세요."
      };
      return messages[error.code] || "로그인하지 못했습니다. 입력값과 Firebase 설정을 확인해주세요.";
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        stopChat();
        loginView.classList.remove("hidden");
        chatView.classList.add("hidden");
        return;
      }
      if (user.uid !== AUTHORIZED_UID) {
        await auth.signOut();
        loginError.textContent = "이 계정은 이 채팅에 사용할 수 없습니다.";
        return;
      }
      loginView.classList.add("hidden");
      chatView.classList.remove("hidden");
      startConnectionStatus();
      startChat();
      pruneOldData().catch(() => setNotice("오래된 기록 정리를 마치지 못했습니다. 다음 접속 때 다시 시도합니다.", true));
    });

    function startConnectionStatus() {
      if (connectedRef) connectedRef.off();
      connectedRef = db.ref(".info/connected");
      connectedRef.on("value", (snapshot) => {
        const online = snapshot.val() === true;
        $("statusDot").classList.toggle("on", online);
        $("statusText").textContent = online ? "연결됨" : "연결 끊김";
      });
    }

    function startChat() {
      if (messagesQuery) messagesQuery.off();
      const messagesRef = db.ref("chat/messages");
      messagesQuery = messagesRef.orderByChild("createdAt").limitToLast(100);
      messagesQuery.on("child_added", (snapshot) => renderMessage(snapshot.key, snapshot.val()), (error) => setNotice("메시지를 읽지 못했습니다. 보안 규칙과 인터넷 연결을 확인해주세요.", true));
      messagesQuery.on("child_removed", (snapshot) => {
        const old = $("msg-" + snapshot.key);
        if (old) old.remove();
        showEmptyIfNeeded();
      });
      messagesQuery.on("child_changed", (snapshot) => {
        const old = $("msg-" + snapshot.key);
        if (old) old.remove();
        renderMessage(snapshot.key, snapshot.val());
      });
    }

    function stopChat() {
      if (messagesQuery) messagesQuery.off();
      if (connectedRef) connectedRef.off();
      messagesQuery = null;
      connectedRef = null;
      document.querySelectorAll(".row").forEach((node) => node.remove());
      $("statusDot").classList.remove("on");
      $("statusText").textContent = "연결 확인 중";
      showEmptyIfNeeded();
    }

    function showEmptyIfNeeded() {
      emptyState.classList.toggle("hidden", messageList.querySelectorAll(".row").length > 0);
    }

    function renderMessage(key, message) {
      if (!message || !message.type) return;
      const existing = $("msg-" + key);
      if (existing) existing.remove();
      emptyState.classList.add("hidden");
      const mine = message.sender === roleSelect.value;
      const row = document.createElement("article");
      row.id = "msg-" + key;
      row.className = "row" + (mine ? " mine" : "");
      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = message.sender || "기기";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const time = document.createElement("time");
      time.className = "time";
      const stamp = Number(message.createdAt) || Date.now();
      time.dateTime = new Date(stamp).toISOString();
      time.textContent = new Intl.DateTimeFormat("ko-KR", { hour: "2-digit", minute: "2-digit" }).format(new Date(stamp));
      if (message.type === "image" && message.photoId) {
        bubble.classList.add("photo-bubble");
        const placeholder = document.createElement("div");
        placeholder.className = "photo-loading";
        placeholder.textContent = "사진 불러오는 중…";
        bubble.appendChild(placeholder);
        db.ref("chat/photoData/" + message.photoId).once("value").then((snapshot) => {
          if (!document.body.contains(row)) return;
          if (!snapshot.exists()) {
            bubble.innerHTML = "";
            const gone = document.createElement("div");
            gone.className = "deleted";
            gone.textContent = "용량 관리를 위해 삭제된 사진입니다.";
            bubble.appendChild(gone);
            return;
          }
          const img = document.createElement("img");
          img.className = "photo";
          img.alt = "전송된 사진";
          img.loading = "lazy";
          img.src = snapshot.val();
          img.addEventListener("click", () => openLightbox(img.src));
          bubble.innerHTML = "";
          bubble.appendChild(img);
        }).catch(() => { placeholder.textContent = "사진을 불러오지 못했습니다."; });
      } else {
        bubble.textContent = message.text || "";
      }
      wrap.append(sender, bubble);
      row.append(wrap, time);
      messageList.appendChild(row);
      messageList.scrollTop = messageList.scrollHeight;
      showEmptyIfNeeded();
    }

    function openLightbox(src) {
      $("lightboxImage").src = src;
      $("lightbox").classList.remove("hidden");
    }
    function closeLightbox() { $("lightbox").classList.add("hidden"); $("lightboxImage").src = ""; }
    $("closeLightbox").addEventListener("click", closeLightbox);
    $("lightbox").addEventListener("click", (event) => { if (event.target === $("lightbox")) closeLightbox(); });

    $("messageForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      const button = $("sendButton");
      button.disabled = true;
      setNotice("전송 중…");
      try {
        const key = db.ref("chat/messages").push().key;
        await db.ref("chat/messages/" + key).set({ type: "text", text: text.slice(0, 2000), sender: roleSelect.value, createdAt: firebase.database.ServerValue.TIMESTAMP });
        messageInput.value = "";
        setNotice("");
        await pruneOldData();
      } catch (error) {
        setNotice("메시지를 보내지 못했습니다. 연결과 데이터베이스 규칙을 확인해주세요.", true);
      } finally { button.disabled = false; }
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("messageForm").requestSubmit(); }
    });

    $("photoInput").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (!file.type.startsWith("image/")) { setNotice("이미지 파일만 보낼 수 있습니다.", true); return; }
      if (file.size > 15 * 1024 * 1024) { setNotice("원본 사진이 너무 큽니다. 15MB 이하 사진을 선택해주세요.", true); return; }
      const button = document.querySelector(".photo-btn");
      button.setAttribute("aria-disabled", "true");
      setNotice("사진을 압축하고 전송 중…");
      try {
        const dataUrl = await compressImage(file);
        const key = db.ref("chat/messages").push().key;
        const now = firebase.database.ServerValue.TIMESTAMP;
        const updates = {};
        updates["messages/" + key] = { type: "image", photoId: key, sender: roleSelect.value, createdAt: now };
        updates["photoMeta/" + key] = { sender: roleSelect.value, createdAt: now };
        updates["photoData/" + key] = dataUrl;
        await db.ref("chat").update(updates);
        setNotice("");
        await pruneOldData();
      } catch (error) {
        setNotice(error.message || "사진을 보내지 못했습니다. 다시 시도해주세요.", true);
      } finally { button.removeAttribute("aria-disabled"); }
    });

    async function compressImage(file) {
      const source = await new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("사진 파일을 읽지 못했습니다.")); };
        img.src = url;
      });
      let blob = null;
      for (const maxSide of [1280, 1080, 900]) {
        const scale = Math.min(1, maxSide / Math.max(source.naturalWidth, source.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(source.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(source.naturalHeight * scale));
        canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
        for (const quality of [0.78, 0.66, 0.55]) {
          blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
          if (blob && blob.size <= MAX_COMPRESSED_BYTES) break;
        }
        if (blob && blob.size <= MAX_COMPRESSED_BYTES) break;
      }
      if (!blob || blob.size > MAX_COMPRESSED_BYTES) throw new Error("압축 후에도 사진이 큽니다. 다른 사진을 선택해주세요.");
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("압축된 사진을 읽지 못했습니다."));
        reader.readAsDataURL(blob);
      });
    }

    async function pruneOldData() {
      if (cleanupBusy || !auth.currentUser || auth.currentUser.uid !== AUTHORIZED_UID) return;
      cleanupBusy = true;
      try {
        const [messageSnapshot, photoSnapshot] = await Promise.all([
          db.ref("chat/messages").once("value"),
          db.ref("chat/photoMeta").once("value")
        ]);
        const updates = {};
        const messages = [];
        messageSnapshot.forEach((child) => messages.push({ key: child.key, value: child.val() || {} }));
        messages.sort((a, b) => (Number(a.value.createdAt) || 0) - (Number(b.value.createdAt) || 0));
        for (const old of messages.slice(0, Math.max(0, messages.length - MAX_MESSAGES))) {
          updates["messages/" + old.key] = null;
          if (old.value.type === "image" && old.value.photoId) {
            updates["photoMeta/" + old.value.photoId] = null;
            updates["photoData/" + old.value.photoId] = null;
          }
        }
        const photos = [];
        photoSnapshot.forEach((child) => photos.push({ key: child.key, value: child.val() || {} }));
        photos.sort((a, b) => (Number(a.value.createdAt) || 0) - (Number(b.value.createdAt) || 0));
        for (const old of photos.slice(0, Math.max(0, photos.length - MAX_PHOTOS))) {
          updates["photoMeta/" + old.key] = null;
          updates["photoData/" + old.key] = null;
          updates["messages/" + old.key] = null;
        }
        if (Object.keys(updates).length) await db.ref("chat").update(updates);
      } finally { cleanupBusy = false; }
    }

    $("logoutButton").addEventListener("click", () => auth.signOut());
  </script>
</body>
